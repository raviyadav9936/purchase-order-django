{% extends "invoices/base.html" %}
{% block title %}Upload Purchase Order{% endblock %}

{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h1 class="text-2xl font-semibold mb-2">Upload Purchase Order</h1>
  <p class="text-sm text-slate-500 mb-4">Choose a PDF or Image file.</p>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="file" accept=".pdf,image/*" class="block mb-4" />
    <button type="submit" class="px-4 py-2 bg-sky-600 text-white rounded hover:bg-sky-700">
      Upload
    </button>
  </form>

  {% if error %}
    <p class="mt-3 text-red-600">{{ error }}</p>
  {% endif %}
</div>
{% endblock %}
