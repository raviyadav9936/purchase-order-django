<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Purchase Orders{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    .table-wrap { overflow-x:auto; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- Navbar -->
  <nav class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <div class="flex items-center gap-4">
          <a href="/" class="text-xl font-semibold text-sky-600">PO Portal</a>
          <a href="{% url 'dashboard' %}" class="text-sm text-slate-600 hover:text-slate-900">Dashboard</a>
          <a href="{% url 'upload' %}" class="text-sm text-slate-600 hover:text-slate-900">Upload PO</a>
        </div>
        <div class="text-sm text-slate-500">
          <span>Logged in as: 
            <strong>{% if request.user.is_authenticated %}{{ request.user.username }}{% else %}Guest{% endif %}</strong>
          </span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-4">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
